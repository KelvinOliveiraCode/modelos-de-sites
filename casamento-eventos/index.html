<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Nome dela] e [Nome dele] | Casamento em [cidade]</title>
<meta name="description" content="Site do casamento de [Nome dela] e [Nome dele]: horarios do grande dia, galeria, pacotes de cerimonial e confirmacao de presenca.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&amp;family=Jost:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFCFA;
  --superficie:#FFFFFF;
  --rosa:#E8B4B8;
  --ouro:#D4AF37;
  --ouro-escuro:#C09A2B;
  --euca:#A3B18A;
  --euca-tinta:#55664B;
  --tinta:#3A2E2E;
  --tinta-media:#6B5B5B;
  --borda:rgba(58,46,46,.16);
  --borda-forte:rgba(58,46,46,.34);
  --sombra:0 12px 32px rgba(58,46,46,.09);
  --erro:#9C3B36;
  --ease-entrada:cubic-bezier(.22,1,.36,1);
  --ease-estado:cubic-bezier(.4,0,.2,1);
  --raio:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:88px}
body{
  margin:0;
  background:var(--bg);
  color:var(--tinta);
  font:400 1rem/1.65 Jost,system-ui,sans-serif;
  overflow-x:hidden;
}
img,svg{max-width:100%}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.12;margin:0}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--tinta);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.container{width:min(94vw, 1560px);margin-inline:auto}
.section{padding:clamp(4rem,9vw,6.5rem) 0}
.kicker{
  font:500 .875rem/1 Jost,sans-serif;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--tinta-media);
  margin-bottom:.9rem;
}
.kicker::after{
  content:"";
  display:block;
  width:44px;
  height:2px;
  margin-top:.7rem;
  background:var(--ouro);
}
.section-titulo{font-size:clamp(2rem,4.4vw,2.9rem);max-width:22ch}
.lead{margin-top:1.1rem;color:var(--tinta-media);max-width:58ch;font-size:1.0625rem}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.55rem;
  min-height:48px;
  padding:.8rem 1.6rem;
  border-radius:999px;
  border:1px solid transparent;
  font:500 .9375rem/1 Jost,sans-serif;
  letter-spacing:.03em;
  text-decoration:none;
  cursor:pointer;
  transition:transform .25s var(--ease-estado),box-shadow .25s var(--ease-estado),background-color .25s var(--ease-estado),border-color .25s var(--ease-estado),color .25s var(--ease-estado);
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-primario{background:var(--ouro);color:var(--tinta);box-shadow:0 10px 22px rgba(192,154,43,.24)}
.btn-primario:hover{background:var(--ouro-escuro)}
.btn-contorno{border-color:var(--borda-forte);color:var(--tinta);background:transparent}
.btn-contorno:hover{border-color:var(--tinta);background:rgba(58,46,46,.05)}
.btn-menor{min-height:44px;padding:.6rem 1.1rem;font-size:.875rem}
.ph{
  position:relative;
  display:grid;
  place-items:center;
  border:1px dashed var(--borda-forte);
  border-radius:var(--raio);
  background:rgba(232,180,184,.13);
  overflow:hidden;
  transition:transform .3s var(--ease-estado),border-color .3s var(--ease-estado),background-color .3s var(--ease-estado);
}
.ph:hover{transform:scale(1.015);border-color:var(--tinta);background:rgba(232,180,184,.2)}
.ph-rotulo{
  font:500 .875rem/1 Jost,sans-serif;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--tinta-media);
  text-align:center;
  padding:.5rem;
}
/* entrada de página: classe no body depois do load */
.stagger{transition:opacity .8s var(--ease-entrada),transform .8s var(--ease-entrada);transition-delay:calc(var(--i,0)*90ms + 120ms)}
body.preload .stagger{opacity:0;transform:translateY(16px)}
body.is-ready .stagger{opacity:1;transform:none}
/* reveal do scroll: classe .reveal no HTML, .is-visible somada pelo JS */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease-entrada),transform .7s var(--ease-entrada);transition-delay:calc(var(--i,0)*80ms)}
.reveal.is-visible{opacity:1;transform:none}
.reveal-line::before{
  content:"";
  position:absolute;
  left:11px;top:8px;bottom:8px;
  width:2px;
  background:rgba(212,175,55,.5);
  transform:scaleY(0);
  transform-origin:top;
  transition:transform .9s var(--ease-entrada) .15s;
}
.reveal-line.is-visible::before{transform:scaleY(1)}
/* CABECALHO */
.site-header{position:sticky;top:0;z-index:60;background:transparent;border-bottom:1px solid transparent;transition:background-color .3s var(--ease-estado),box-shadow .3s var(--ease-estado),border-color .3s var(--ease-estado)}
.site-header.is-stuck{background:rgba(255,252,250,.96);box-shadow:0 8px 22px rgba(58,46,46,.08);border-color:var(--borda)}
.header-interno{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.1rem 0;transition:padding .3s var(--ease-estado)}
.site-header.is-stuck .header-interno{padding:.7rem 0}
.marca{display:inline-flex;align-items:center;gap:.6rem;text-decoration:none;font-family:"Cormorant Garamond",serif;font-size:1.15rem;font-weight:600;letter-spacing:.02em}
.marca-svg{flex:none}
.marca-amp{color:var(--ouro-escuro);padding:0 .15rem}
.menu-btn{
  display:none;
  align-items:center;
  justify-content:center;
  width:48px;height:48px;
  border:1px solid var(--borda-forte);
  border-radius:12px;
  background:var(--bg);
  cursor:pointer;
  transition:border-color .2s var(--ease-estado),background-color .2s var(--ease-estado);
}
.menu-btn:hover{border-color:var(--tinta);background:rgba(58,46,46,.05)}
.menu-risco{display:block;width:20px;height:2px;background:var(--tinta);position:relative;transition:transform .25s var(--ease-estado),opacity .25s var(--ease-estado)}
.menu-risco::before,.menu-risco::after{content:"";position:absolute;left:0;width:20px;height:2px;background:var(--tinta);transition:transform .25s var(--ease-estado)}
.menu-risco::before{top:-6px}
.menu-risco::after{top:6px}
.menu-btn[aria-expanded="true"] .menu-risco{transform:rotate(45deg)}
.menu-btn[aria-expanded="true"] .menu-risco::before{transform:translateY(6px) rotate(-90deg)}
.menu-btn[aria-expanded="true"] .menu-risco::after{opacity:0}
.nav ul{display:flex;align-items:center;gap:1.6rem}
.nav a{
  text-decoration:none;
  font:500 .9375rem/1 Jost,sans-serif;
  color:var(--tinta);
  padding:.4rem 0;
  position:relative;
  transition:color .2s var(--ease-estado);
}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--ouro);transform:scaleX(0);transform-origin:left;transition:transform .25s var(--ease-estado)}
.nav a:hover{color:var(--tinta)}
.nav a:hover::after{transform:scaleX(1)}
.nav-cta{
  background:var(--ouro);
  color:var(--tinta)!important;
  padding:.6rem 1.2rem!important;
  border-radius:999px;
  min-height:44px;
  display:inline-flex;
  align-items:center;
  transition:background-color .25s var(--ease-estado),transform .25s var(--ease-estado);
}
.nav-cta::after{display:none}
.nav-cta:hover{background:var(--ouro-escuro);transform:translateY(-2px)}
/* HERO */
.hero{
  position:relative;
  overflow:hidden;
  min-height:600px;
  min-height:min(86vh,760px);
  min-height:min(86dvh,760px);
  display:flex;
  align-items:center;
  padding:calc(5rem + 24px) 0 4rem;
  background:radial-gradient(125% 95% at 50% 0%,rgba(232,180,184,.22),rgba(255,252,250,0) 62%);
}
.hero-conteudo{position:relative;z-index:3;text-align:center;max-width:44rem;margin-inline:auto}
.hero-eyebrow{
  font:500 .875rem/1 Jost,sans-serif;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--tinta-media);
}
.hero-nomes{
  font-family:"Cormorant Garamond",serif;
  font-style:italic;
  font-weight:600;
  font-size:clamp(2.4rem,7vw,4.2rem);
  line-height:1.12;
  margin:1.1rem 0 0;
  color:var(--tinta);
  text-wrap:balance;
}
.hero-amp{font-style:normal;color:var(--ouro-escuro);padding:0 .18em;font-size:.72em;vertical-align:.06em}
.hero-data{
  margin-top:1.2rem;
  font-family:"Cormorant Garamond",serif;
  font-size:clamp(1.25rem,3.4vw,1.6rem);
  letter-spacing:.06em;
  color:var(--tinta);
}
.hero-data span{display:inline-block;padding:0 .55rem;position:relative}
.hero-data span+span::before{content:"";position:absolute;left:-2px;top:50%;width:4px;height:4px;border-radius:50%;background:var(--ouro);transform:translateY(-50%)}
.hero-local{margin-top:.7rem;color:var(--tinta-media);font-size:1.0625rem}
.hero-acoes{display:flex;flex-wrap:wrap;gap:.9rem;justify-content:center;margin-top:2.2rem}
.hero-arco{position:absolute;top:0;right:0;height:100%;width:min(460px,58vw);z-index:1;pointer-events:none}
.hero-parallax{position:absolute;left:clamp(20px,3.6vw,60px);bottom:clamp(16px,3vw,40px);width:min(210px,26vw);z-index:1;pointer-events:none}
.arco-tracado{stroke-dasharray:260;stroke-dashoffset:0;animation:tracar 12s cubic-bezier(.45,0,.55,1) infinite}
@keyframes tracar{0%,10%{stroke-dashoffset:260}55%,100%{stroke-dashoffset:0}}
.folha{transform-box:fill-box;transform-origin:bottom center;animation:balanco 9s ease-in-out infinite}
.folha-atrasada{animation-delay:-3s;animation-duration:11s}
@keyframes balanco{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
.petalas{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4}
.petala{
  position:absolute;
  top:-8%;
  width:12px;height:12px;
  background:var(--rosa);
  border-radius:72% 0 72% 0;
  opacity:0;
  animation-name:cair;
  animation-iteration-count:infinite;
  animation-timing-function:cubic-bezier(.45,0,.55,1);
  will-change:transform,opacity;
}
.petala-euca{background:var(--euca);width:10px;height:10px}
.petala:nth-child(1){left:7%;animation-duration:13s;animation-delay:0s}
.petala:nth-child(2){left:19%;animation-duration:16s;animation-delay:-4s;width:9px;height:9px}
.petala:nth-child(3){left:34%;animation-duration:12s;animation-delay:-8s}
.petala:nth-child(4){left:58%;animation-duration:15s;animation-delay:-2s}
.petala:nth-child(5){left:74%;animation-duration:14s;animation-delay:-10s;width:8px;height:8px}
.petala:nth-child(6){left:89%;animation-duration:17s;animation-delay:-6s}
@keyframes cair{
  0%{transform:translate3d(0,0,0) rotate(0deg);opacity:0}
  8%{opacity:.85}
  86%{opacity:.5}
  100%{transform:translate3d(42px,98vh,0) rotate(280deg);opacity:0}
}
/* O GRANDE DIA: TIMELINE */
.dia{background:var(--superficie);border-block:1px solid var(--borda)}
.timeline{position:relative;margin-top:2.8rem;padding-left:0}
.tl-item{position:relative;padding:0 0 2.4rem 2.9rem}
.tl-item:last-child{padding-bottom:0}
.tl-marcador{
  position:absolute;
  left:2px;top:2px;
  width:20px;height:20px;
  border-radius:50%;
  background:var(--bg);
  border:2px solid var(--ouro);
  display:grid;
  place-items:center;
}
.tl-marcador::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--rosa)}
.tl-cabeca{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.tl-icone{flex:none;color:var(--euca-tinta)}
.tl-hora{font:500 .9375rem/1 Jost,sans-serif;letter-spacing:.08em;color:var(--tinta-media);border:1px solid var(--borda);border-radius:999px;padding:.35rem .8rem}
.tl-item h3{font-size:1.5rem;margin:.7rem 0 .35rem}
.tl-item p{color:var(--tinta-media);max-width:52ch}
/* GALERIA */
.galeria-grade{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:118px;gap:.8rem;margin-top:2.6rem}
.galeria-grade .ph:nth-child(1){grid-column:span 2}
.galeria-grade .ph:nth-child(4){grid-row:span 2}
/* PACOTES */
.pacotes{background:var(--superficie);border-block:1px solid var(--borda)}
.pacotes-grade{display:grid;grid-template-columns:1fr;gap:1.4rem;margin-top:2.6rem}
.pacote{
  background:var(--bg);
  border:1px solid var(--borda);
  border-radius:var(--raio);
  padding:1.9rem 1.6rem;
  display:flex;
  flex-direction:column;
  transition:transform .3s var(--ease-estado),box-shadow .3s var(--ease-estado),border-color .3s var(--ease-estado);
}
.pacote:hover{transform:translateY(-4px);box-shadow:var(--sombra);border-color:var(--borda-forte)}
.pacote-destaque{border-color:var(--ouro);background:linear-gradient(180deg,rgba(232,180,184,.14),rgba(255,252,250,0) 55%)}
.pacote h3{font-size:1.7rem}
.pacote-preco{font-family:"Cormorant Garamond",serif;font-size:2.4rem;margin:.8rem 0 .2rem}
.pacote-obs{color:var(--tinta-media);font-size:.9375rem}
.pacote-lista{margin:1.4rem 0 1.8rem;display:grid;gap:.75rem}
.pacote-lista li{display:flex;gap:.65rem;align-items:flex-start;color:var(--tinta)}
.pacote-lista svg{flex:none;margin-top:.28rem;color:var(--euca-tinta)}
.pacote .btn{margin-top:auto}
.pacotes-nota{margin-top:1.6rem;color:var(--tinta-media);font-size:.9375rem;max-width:62ch}
/* QUEM ASSINA */
.assina-grade{display:grid;grid-template-columns:1fr;gap:2rem;align-items:center;margin-top:.6rem}
.assina-foto{aspect-ratio:4/5;min-height:280px}
.assina-texto h2{font-size:clamp(2rem,4.2vw,2.7rem)}
.assina-cargo{margin-top:1.4rem;font:500 .9375rem/1 Jost,sans-serif;letter-spacing:.06em;color:var(--tinta-media)}
.assina-citacao{
  margin:1.6rem 0 0;
  padding-left:1.2rem;
  border-left:2px solid var(--ouro);
  font-family:"Cormorant Garamond",serif;
  font-size:1.3rem;
  font-style:italic;
  color:var(--tinta);
}
.assina-citacao cite{display:block;margin-top:.6rem;font:400 .9375rem/1.4 Jost,sans-serif;font-style:normal;color:var(--tinta-media)}
.assina-mono{margin-top:1.6rem}
.mono-circulo{stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .9s var(--ease-entrada)}
.reveal.is-visible .mono-circulo{stroke-dashoffset:0}
/* RSVP */
.rsvp{background:var(--superficie);border-block:1px solid var(--borda)}
.rsvp-grade{display:grid;grid-template-columns:1fr;gap:2.4rem}
.rsvp-info h2{font-size:clamp(2rem,4.2vw,2.8rem)}
.rsvp-info-lista{margin-top:1.6rem;display:grid;gap:.9rem}
.rsvp-info-lista li{display:flex;gap:.7rem;align-items:flex-start;color:var(--tinta-media)}
.rsvp-info-lista svg{flex:none;margin-top:.25rem;color:var(--euca-tinta)}
.rsvp-info-lista strong{color:var(--tinta);font-weight:500}
.form{
  background:var(--bg);
  border:1px solid var(--borda);
  border-radius:var(--raio);
  padding:1.7rem 1.4rem;
  display:grid;
  gap:1.2rem;
}
.campo{display:grid;gap:.45rem;border:0;padding:0;margin:0;min-width:0}
.campo > label,.campo legend{font:500 .9375rem/1.4 Jost,sans-serif;color:var(--tinta);padding:0}
.campo input,.campo select,.campo textarea{
  width:100%;
  min-height:48px;
  padding:.7rem .9rem;
  border:1px solid var(--borda-forte);
  border-radius:10px;
  background:var(--superficie);
  color:var(--tinta);
  font:400 1rem/1.4 Jost,sans-serif;
  transition:border-color .2s var(--ease-estado),box-shadow .2s var(--ease-estado);
}
.campo textarea{min-height:96px;resize:vertical}
.campo input:hover,.campo select:hover,.campo textarea:hover{border-color:var(--tinta)}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--euca-tinta);box-shadow:0 0 0 3px rgba(163,177,138,.32);outline:none}
.campo .erro{color:var(--erro);font-size:.875rem;display:flex;gap:.4rem;align-items:center}
.campo.has-erro input,.campo.has-erro select,.campo.has-erro textarea{border-color:var(--erro);box-shadow:0 0 0 3px rgba(156,59,54,.12)}
.radio-linha{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:.2rem}
.radio-opcao{
  display:inline-flex;
  align-items:center;
  gap:.55rem;
  min-height:48px;
  padding:.55rem 1rem;
  border:1px solid var(--borda-forte);
  border-radius:999px;
  cursor:pointer;
  transition:border-color .2s var(--ease-estado),background-color .2s var(--ease-estado);
}
.radio-opcao:hover{border-color:var(--tinta)}
.radio-opcao input{width:18px;height:18px;accent-color:var(--euca-tinta);min-height:0;padding:0}
.campo.has-erro .radio-opcao{border-color:var(--erro)}
.form-rodape{display:grid;gap:1rem;justify-items:start}
.form-aviso{color:var(--tinta-media);font-size:.875rem}
.sucesso{
  display:grid;
  gap:.7rem;
  padding:1.3rem;
  border-radius:12px;
  background:rgba(163,177,138,.2);
  border:1px solid var(--euca);
  color:var(--euca-tinta);
}
.sucesso[hidden]{display:none}
.sucesso strong{font-family:"Cormorant Garamond",serif;font-size:1.4rem;color:var(--tinta)}
.sucesso-anim{animation:sucessoEntrada .6s var(--ease-entrada) both}
@keyframes sucessoEntrada{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
/* LISTA DE CONVIDADOS */
.convidados{margin-top:2rem;background:var(--bg);border:1px solid var(--borda);border-radius:var(--raio);padding:1.5rem 1.3rem}
.convidados h3{font-size:1.4rem}
.convidados-ajuda{margin-top:.4rem;color:var(--tinta-media);font-size:.9375rem}
.convidados-add{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.1rem;align-items:center}
.convidados-add input{
  flex:1 1 200px;
  min-width:0;
  min-height:44px;
  padding:.6rem .85rem;
  border:1px solid var(--borda-forte);
  border-radius:10px;
  background:var(--superficie);
  color:var(--tinta);
  font:400 1rem/1.4 Jost,sans-serif;
  transition:border-color .2s var(--ease-estado),box-shadow .2s var(--ease-estado);
}
.convidados-add input:hover{border-color:var(--tinta)}
.convidados-add input:focus{border-color:var(--euca-tinta);box-shadow:0 0 0 3px rgba(163,177,138,.32);outline:none}
.convidados-erro{color:var(--erro);font-size:.875rem}
.convidados-lista{margin-top:1.1rem;display:grid;gap:.55rem}
.convidados-lista li{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:.8rem;
  padding:.6rem .8rem;
  border:1px solid var(--borda);
  border-radius:10px;
  background:var(--superficie);
  animation:itemEntrada .45s var(--ease-entrada) both;
}
@keyframes itemEntrada{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.convidados-remover{
  border:1px solid var(--borda-forte);
  background:transparent;
  color:var(--tinta);
  border-radius:999px;
  min-height:36px;
  padding:.25rem .8rem;
  font:500 .8125rem/1 Jost,sans-serif;
  cursor:pointer;
  transition:border-color .2s var(--ease-estado),background-color .2s var(--ease-estado);
}
.convidados-remover:hover{border-color:var(--tinta);background:rgba(58,46,46,.06)}
.convidados-vazio{margin-top:1rem;color:var(--tinta-media);font-size:.9375rem}
.convidados-vazio[hidden]{display:none}
/* FAQ */
.faq-lista{margin-top:2.4rem;display:grid;gap:.8rem;max-width:52rem}
.faq-item{border:1px solid var(--borda);border-radius:12px;background:var(--superficie);overflow:hidden}
.faq-pergunta{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  text-align:left;
  background:transparent;
  border:0;
  cursor:pointer;
  padding:1.15rem 1.2rem;
  min-height:56px;
  font-family:"Cormorant Garamond",serif;
  font-size:1.32rem;
  font-weight:600;
  color:var(--tinta);
  transition:background-color .2s var(--ease-estado);
}
.faq-pergunta:hover{background:rgba(232,180,184,.16)}
.faq-sinal{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--borda-forte);display:grid;place-items:center;position:relative}
.faq-sinal::before,.faq-sinal::after{content:"";position:absolute;background:var(--tinta);transition:transform .25s var(--ease-estado),opacity .25s var(--ease-estado)}
.faq-sinal::before{width:11px;height:1.5px}
.faq-sinal::after{width:1.5px;height:11px}
.faq-pergunta[aria-expanded="true"] .faq-sinal::after{transform:rotate(90deg);opacity:0}
.faq-resposta{max-height:0;overflow:hidden;transition:max-height .45s var(--ease-estado)}
.faq-resposta p{padding:0 1.2rem 1.3rem;color:var(--tinta-media)}
.faq-rodape{margin-top:2rem;color:var(--tinta-media)}
.faq-rodape a{color:var(--tinta);text-decoration:none;border-bottom:1px solid var(--ouro);padding-bottom:1px;transition:border-color .2s var(--ease-estado)}
.faq-rodape a:hover{border-color:var(--tinta)}
/* RODAPE */
.site-footer{background:var(--tinta);color:#F6EFEA;padding:3.4rem 0 1.8rem}
.rodape-grade{display:grid;grid-template-columns:1fr;gap:2.2rem}
.site-footer h2{font-size:1.8rem;color:#FFFCFA}
.site-footer p{color:rgba(246,239,234,.82);margin-top:.7rem;max-width:40ch}
.rodape-titulo{font:500 .875rem/1 Jost,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(246,239,234,.7);margin-bottom:.9rem}
.rodape-contato{display:grid;gap:.7rem}
.rodape-contato li{display:flex;gap:.65rem;align-items:flex-start;color:#F6EFEA}
.rodape-contato svg{flex:none;margin-top:.25rem;color:var(--rosa)}
.rodape-contato a{text-decoration:none;border-bottom:1px solid rgba(212,175,55,.7);padding-bottom:1px;transition:border-color .2s var(--ease-estado)}
.rodape-contato a:hover{border-color:#F6EFEA}
.rodape-nav{display:grid;gap:.6rem}
.rodape-nav a{color:#F6EFEA;text-decoration:none;font-size:.9375rem;transition:color .2s var(--ease-estado)}
.rodape-nav a:hover{color:var(--rosa)}
.rodape-assinatura{margin-top:2.6rem;padding-top:1.4rem;border-top:1px solid rgba(246,239,234,.22);display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;align-items:center}
.rodape-assinatura p{margin:0;font-size:.875rem;color:rgba(246,239,234,.82)}
.rodape-assinatura a{color:#FFFCFA;text-decoration:none;border-bottom:1px solid var(--ouro);padding-bottom:1px;transition:border-color .2s var(--ease-estado)}
.rodape-assinatura a:hover{border-color:#FFFCFA}
.voltar-topo{color:rgba(246,239,234,.82);text-decoration:none;font-size:.875rem;transition:color .2s var(--ease-estado)}
.voltar-topo:hover{color:#FFFCFA}
/* RESPONSIVO: um breakpoint principal em 760px */
@media (max-width:759px){
  .menu-btn{display:inline-flex}
  .nav{
    position:absolute;
    top:100%;left:0;right:0;
    background:var(--bg);
    border-bottom:1px solid var(--borda);
    box-shadow:var(--sombra);
    display:none;
    padding:.8rem 1.25rem 1.3rem;
  }
  .nav.is-open{display:block;animation:menuEntrada .25s var(--ease-estado) both}
  @keyframes menuEntrada{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .nav ul{flex-direction:column;align-items:stretch;gap:.2rem}
  .nav a{display:flex;align-items:center;min-height:48px;padding:.5rem .2rem}
  .nav a::after{display:none}
  .nav-cta{justify-content:center;margin-top:.6rem;padding:.7rem 1.2rem}
  .hero-arco{opacity:.55}
  .hero-parallax{display:none}
}
@media (min-width:760px){
  .galeria-grade{grid-template-columns:repeat(6,1fr);grid-auto-rows:132px;gap:1rem}
  .galeria-grade .ph:nth-child(1){grid-column:span 3;grid-row:span 2}
  .galeria-grade .ph:nth-child(2){grid-column:span 3}
  .galeria-grade .ph:nth-child(3){grid-column:span 2}
  .galeria-grade .ph:nth-child(4){grid-column:span 1;grid-row:span 2}
  .galeria-grade .ph:nth-child(5){grid-column:span 3}
  .galeria-grade .ph:nth-child(6){grid-column:span 2}
  .pacotes-grade{grid-template-columns:1fr 1fr;gap:1.6rem}
  .assina-grade{grid-template-columns:.85fr 1.15fr;gap:2.8rem}
  .rsvp-grade{grid-template-columns:.9fr 1.1fr;gap:3rem}
  .form{padding:2.1rem 1.9rem}
  .rodape-grade{grid-template-columns:1.1fr .9fr .8fr}
  .tl-cabeca{gap:1rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
    scroll-behavior:auto!important;
  }
  body.preload .stagger,.reveal{opacity:1!important;transform:none!important}
  .reveal-line::before{transform:scaleY(1)!important}
  .mono-circulo{stroke-dashoffset:0!important}
  .petala{display:none}
}

            <span>Cada convidado confirma o próprio nome. Acompanhantes entram na lista abaixo.</span>
          </li>
          <li class="reveal" style="--i:5">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false"><path d="M4 5h12v9H8l-4 3V5z"/></svg>
            <span>Dúvida ou mudança de última hora: [(00) 00000-0000]</span>
          </li>
        </ul>
      </div>
      <form class="form" id="formRsvp" novalidate>
        <div class="campo">
          <label for="campoNome">Seu nome completo</label>
          <input id="campoNome" name="nome" type="text" autocomplete="name" placeholder="[seu nome]" required>
          <p class="erro" id="erroNome" hidden></p>
        </div>
        <div class="campo">
          <label for="campoEmail">E-mail</label>
          <input id="campoEmail" name="email" type="email" autocomplete="email" placeholder="[seu@email.com]" required>
          <p class="erro" id="erroEmail" hidden></p>
        </div>
        <fieldset class="campo">
          <legend>Você consegue ir?</legend>
          <div class="radio-linha">
            <label class="radio-opcao"><input type="radio" name="presenca" value="sim" required><span>Sim, confirmo</span></label>
            <label class="radio-opcao"><input type="radio" name="presenca" value="nao" required><span>Não posso ir</span></label>
          </div>
          <p class="erro" id="erroPresenca" hidden></p>
        </fieldset>
        <div class="campo">
          <label for="campoAcompanhantes">Acompanhantes além de você</label>
          <select id="campoAcompanhantes" name="acompanhantes">
            <option value="0">Nenhum</option>
            <option value="1">1 pessoa</option>
            <option value="2">2 pessoas</option>
            <option value="3">3 pessoas</option>
            <option value="4">4 pessoas</option>
            <option value="5+">5 ou mais (a gente confirma por telefone)</option>
          </select>
        </div>
        <div class="campo">
          <label for="campoObservacao">Restrição alimentar ou observação (opcional)</label>
          <textarea id="campoObservacao" name="observacao" placeholder="[sem glúten, sem lactose, nada a declarar]"></textarea>
        </div>
        <div class="form-rodape">
          <button class="btn btn-primario" type="submit">Confirmar presença</button>
          <p class="form-aviso">Formulário de demonstração: os dados ficam só nesta tela.</p>
        </div>
        <div class="sucesso" id="sucessoRsvp" role="status" hidden></div>
      </form>
    </div>
    <div class="container">
      <div class="convidados reveal" style="--i:0">
        <h3>Quem vem com você</h3>
        <p class="convidados-ajuda">Opcional. Escreva o nome de cada pessoa do seu grupo e monte a lista antes de enviar.</p>
        <div class="convidados-add">
          <label class="sr-only" for="campoConvidado">Nome do acompanhante</label>
          <input id="campoConvidado" type="text" placeholder="[nome do acompanhante]" autocomplete="off">
          <button class="btn btn-contorno btn-menor" type="button" id="btnAddConvidado">Adicionar à lista</button>
        </div>
        <p class="convidados-erro" id="erroConvidado" hidden></p>
        <ul class="convidados-lista" id="listaConvidados" aria-live="polite"></ul>
        <p class="convidados-vazio" id="listaVazia">Sua lista está vazia. Adicione o nome de quem vem com você.</p>
      </div>
    </div>
  </section>

  <section class="section" id="faq" aria-labelledby="titulo-faq">
    <div class="container">
      <p class="kicker reveal" style="--i:0">Perguntas frequentes</p>
      <h2 class="section-titulo reveal" id="titulo-faq" style="--i:1">O que os casais perguntam antes de fechar</h2>
      <div class="faq-lista">
        <article class="faq-item reveal" style="--i:0">
          <h3>
            <button class="faq-pergunta" type="button" id="faqBtn1" aria-expanded="false" aria-controls="faqPainel1">
              Quantos convidados vocês atendem?
              <span class="faq-sinal" aria-hidden="true"></span>
            </button>
          </h3>
          <div class="faq-resposta" id="faqPainel1" role="region" aria-labelledby="faqBtn1" hidden>
            <p>Trabalhamos de [00] a [00] convidados. Para listas maiores, indicamos o espaço pelo formato e pelo orçamento antes de qualquer coisa.</p>
          </div>
        </article>
        <article class="faq-item reveal" style="--i:1">
          <h3>
            <button class="faq-pergunta" type="button" id="faqBtn2" aria-expanded="false" aria-controls="faqPainel2">
              Posso contratar outro fornecedor por fora?
              <span class="faq-sinal" aria-hidden="true"></span>
            </button>
          </h3>
          <div class="faq-resposta" id="faqPainel2" role="region" aria-labelledby="faqBtn2" hidden>
            <p>Pode. A gente conversa com o fornecedor antes para alinhar horário de entrada, acesso e o que ele leva. Tudo combinado por escrito, no mesmo documento.</p>
          </div>
        </article>
        <article class="faq-item reveal" style="--i:2">
          <h3>
            <button class="faq-pergunta" type="button" id="faqBtn3" aria-expanded="false" aria-controls="faqPainel3">
              E se chover no dia?
              <span class="faq-sinal" aria-hidden="true"></span>
            </button>
          </h3>
          <div class="faq-resposta" id="faqPainel3" role="region" aria-labelledby="faqBtn3" hidden>
            <p>Todo evento tem plano B combinado com o espaço na semana que antecede, com o custo do plano B definido antes. Nenhuma surpresa no dia.</p>
          </div>
        </article>
        <article class="faq-item reveal" style="--i:3">
          <h3>
            <button class="faq-pergunta" type="button" id="faqBtn4" aria-expanded="false" aria-controls="faqPainel4">
              Como funciona o pagamento?
              <span class="faq-sinal" aria-hidden="true"></span>
            </button>
          </h3>
          <div class="faq-resposta" id="faqPainel4" role="region" aria-labelledby="faqBtn4" hidden>
            <p>Entrada na assinatura do contrato e o restante parcelado até [data]. O orçamento só é fechado depois da visita ao espaço.</p>
          </div>
        </article>
      </div>
      <p class="faq-rodape reveal" style="--i:0">Ficou outra dúvida? <a href="#rsvp">Falar com a gente</a> e a gente responde por [(00) 00000-0000].</p>
    </div>
  </section>
</main>

<script>
(function(){
  "use strict";
  var body = document.body;

  /* Entrada de página: a classe sai do body depois do load. */
  function pronto(){
    body.classList.remove("preload");
    body.classList.add("is-ready");
  }
  window.addEventListener("load", pronto);
  setTimeout(pronto, 1500);

  var reduzMovimento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Reveal do scroll: IntersectionObserver, escalonado por --i nos filhos. */
  var alvos = document.querySelectorAll(".reveal, .reveal-line");
  if("IntersectionObserver" in window && !reduzMovimento){
    var observador = new IntersectionObserver(function(entradas){
      entradas.forEach(function(entrada){
        if(entrada.isIntersecting){
          entrada.target.classList.add("is-visible");
          observador.unobserve(entrada.target);
        }
      });
    }, { threshold: 0.15, rootMargin: "0px 0px -6% 0px" });
    alvos.forEach(function(alvo){ observador.observe(alvo); });
  } else {
    alvos.forEach(function(alvo){ alvo.classList.add("is-visible"); });
  }

  /* Cabecalho que reage ao scroll e parallax leve, ambos em requestAnimationFrame. */
  var cabecalho = document.querySelector(".site-header");
  var camada = document.getElementById("heroParallax");
  var podeDeslizar = window.matchMedia("(min-width: 760px)").matches && !reduzMovimento;
  var rodando = false;

  function noQuadro(){
    var deslocamento = window.pageYOffset || document.documentElement.scrollTop;
    if(cabecalho){
      cabecalho.classList.toggle("is-stuck", deslocamento > 20);
    }
    if(camada && podeDeslizar && deslocamento < window.innerHeight){
      camada.style.transform = "translate3d(0," + (deslocamento * 0.16).toFixed(1) + "px,0)";
    }
    rodando = false;
  }

  function aoRolar(){
    if(rodando){ return; }
    rodando = true;
    window.requestAnimationFrame(noQuadro);
  }

  window.addEventListener("scroll", aoRolar, { passive: true });
  window.addEventListener("resize", function(){
    podeDeslizar = window.matchMedia("(min-width: 760px)").matches && !reduzMovimento;
    noQuadro();
  });
  noQuadro();

  /* Menu mobile: abre e fecha de verdade. */
  var botao = document.getElementById("menuBtn");
  var menu = document.getElementById("menuPrimario");

  function fecharMenu(){
    botao.setAttribute("aria-expanded", "false");
    botao.setAttribute("aria-label", "Abrir menu de navegação");
    menu.classList.remove("is-open");
  }

  botao.addEventListener("click", function(){
    var aberto = botao.getAttribute("aria-expanded") === "true";
    botao.setAttribute("aria-expanded", aberto ? "false" : "true");
    botao.setAttribute("aria-label", aberto ? "Abrir menu de navegação" : "Fechar menu de navegação");
    menu.classList.toggle("is-open", !aberto);
  });

  menu.addEventListener("click", function(evento){
    if(evento.target.closest("a")){ fecharMenu(); }
  });

  document.addEventListener("keydown", function(evento){
    if(evento.key === "Escape" && menu.classList.contains("is-open")){
      fecharMenu();
      botao.focus();
    }
  });

  /* FAQ em acordeão com transição de altura real. */
  var perguntas = document.querySelectorAll(".faq-pergunta");

  function abrirPainel(botaoAtual, painel){
    botaoAtual.setAttribute("aria-expanded", "true");
    painel.hidden = false;
    painel.style.maxHeight = painel.scrollHeight + "px";
    var aoTerminar = function(evento){
      if(evento.propertyName !== "max-height"){ return; }
      painel.style.maxHeight = "none";
      painel.removeEventListener("transitionend", aoTerminar);
    };
    painel.addEventListener("transitionend", aoTerminar);
  }

  function fecharPainel(botaoAtual, painel){
    botaoAtual.setAttribute("aria-expanded", "false");
    painel.style.maxHeight = painel.scrollHeight + "px";
    window.requestAnimationFrame(function(){
      painel.style.maxHeight = "0px";
    });
    var aoTerminar = function(evento){
      if(evento.propertyName !== "max-height"){ return; }
      painel.hidden = true;
      painel.removeEventListener("transitionend", aoTerminar);
    };
    painel.addEventListener("transitionend", aoTerminar);
  }

  perguntas.forEach(function(pergunta){
    pergunta.addEventListener("click", function(){
      var painel = document.getElementById(pergunta.getAttribute("aria-controls"));
      var aberto = pergunta.getAttribute("aria-expanded") === "true";
      perguntas.forEach(function(outra){
        if(outra !== pergunta && outra.getAttribute("aria-expanded") === "true"){
          fecharPainel(outra, document.getElementById(outra.getAttribute("aria-controls")));
        }
      });
      if(aberto){ fecharPainel(pergunta, painel); } else { abrirPainel(pergunta, painel); }
    });
  });

  /* RSVP: validação por campo, mensagem de erro e estado de sucesso. */
  var formulario = document.getElementById("formRsvp");
  var sucesso = document.getElementById("sucessoRsvp");
  var campoNome = document.getElementById("campoNome");
  var campoEmail = document.getElementById("campoEmail");
  var erroNome = document.getElementById("erroNome");
  var erroEmail = document.getElementById("erroEmail");
  var radios = formulario.querySelectorAll('input[name="presenca"]');
  var erroPresenca = document.getElementById("erroPresenca");

  function marcarErro(campo, alvo, mensagem){
    campo.classList.add("has-erro");
    campo.removeAttribute("hidden");
    alvo.textContent = mensagem;
    alvo.hidden = false;
  }

  function limparErro(campo, alvo){
    campo.classList.remove("has-erro");
    alvo.hidden = true;
    alvo.textContent = "";
  }

  function validarNome(){
    var valor = campoNome.value.trim();
    if(valor.length < 3){
      marcarErro(campoNome.closest(".campo"), erroNome, "Escreva seu nome completo.");
      return false;
    }
    limparErro(campoNome.closest(".campo"), erroNome);
    return true;
  }

  function validarEmail(){
    var valor = campoEmail.value.trim();
    var padrao = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    if(!padrao.test(valor)){
      marcarErro(campoEmail.closest(".campo"), erroEmail, "Escreva um e-mail válido, como nome@email.com.");
      return false;
    }
    limparErro(campoEmail.closest(".campo"), erroEmail);
    return true;
  }

  function validarPresenca(){
    var marcado = formulario.querySelector('input[name="presenca"]:checked');
    var campo = radios[0].closest(".campo");
    if(!marcado){
      marcarErro(campo, erroPresenca, "Escolha uma das opções.");
      return false;
    }
    limparErro(campo, erroPresenca);
    return true;
  }

  campoNome.addEventListener("blur", validarNome);
  campoNome.addEventListener("input", function(){
    if(campoNome.closest(".campo").classList.contains("has-erro")){ validarNome(); }
  });
  campoEmail.addEventListener("blur", validarEmail);
  campoEmail.addEventListener("input", function(){
    if(campoEmail.closest(".campo").classList.contains("has-erro")){ validarEmail(); }
  });
  radios.forEach(function(radio){
    radio.addEventListener("change", validarPresenca);
  });

  formulario.addEventListener("submit", function(evento){
    evento.preventDefault();
    var nomeOk = validarNome();
    var emailOk = validarEmail();
    var presencaOk = validarPresenca();
    if(!nomeOk || !emailOk || !presencaOk){
      if(!nomeOk){ campoNome.focus(); } else if(!emailOk){ campoEmail.focus(); }
      return;
    }
    var acompanhantes = document.getElementById("campoAcompanhantes").value;
    var nomes = convidados.map(function(item){ return item.nome; });
    var texto = "Presença registrada. Obrigado, " + campoNome.value.trim() + ". ";
    texto += acompanhantes === "0" ? "Você confirmou vir sozinho(a)." : "Acompanhantes: " + acompanhantes + ".";
    if(nomes.length){
      texto += " Nomes na sua lista: " + nomes.join(", ") + ".";
    }
    texto += " Se algo mudar, avise a gente por [(00) 00000-0000].";
    sucesso.textContent = texto;
    sucesso.hidden = false;
    sucesso.classList.add("sucesso-anim");
    sucesso.scrollIntoView({ behavior: reduzMovimento ? "auto" : "smooth", block: "center" });
  });

  /* Lista de convidados com estado vazio de verdade. */
  var convidados = [];
  var campoConvidado = document.getElementById("campoConvidado");
  var botaoAdd = document.getElementById("btnAddConvidado");
  var lista = document.getElementById("listaConvidados");
  var listaVazia = document.getElementById("listaVazia");
  var erroConvidado = document.getElementById("erroConvidado");

  function mostrarErroConvidado(mensagem){
    erroConvidado.textContent = mensagem;
    erroConvidado.hidden = false;
  }

  function desenharLista(){
    lista.innerHTML = "";
    convidados.forEach(function(item, indice){
      var linha = document.createElement("li");
      var nome = document.createElement("span");
      nome.textContent = item.nome;
      var remover = document.createElement("button");
      remover.type = "button";
      remover.className = "convidados-remover";
      remover.textContent = "Remover";
      remover.setAttribute("aria-label", "Remover " + item.nome + " da lista");
      remover.addEventListener("click", function(){
        convidados.splice(indice, 1);
        desenharLista();
      });
      linha.appendChild(nome);
      linha.appendChild(remover);
      lista.appendChild(linha);
    });
    listaVazia.hidden = convidados.length > 0;
  }

  function adicionarConvidado(){
    var valor = campoConvidado.value.trim();
    if(valor.length < 2){
      mostrarErroConvidado("Escreva o nome antes de adicionar.");
      campoConvidado.focus();
      return;
    }
    if(convidados.some(function(item){ return item.nome.toLowerCase() === valor.toLowerCase(); })){
      mostrarErroConvidado("Esse nome já está na lista.");
      campoConvidado.focus();
      return;
    }
    erroConvidado.hidden = true;
    convidados.push({ nome: valor });
    campoConvidado.value = "";
    campoConvidado.focus();
    desenharLista();
  }

  botaoAdd.addEventListener("click", adicionarConvidado);
  campoConvidado.addEventListener("keydown", function(evento){
    if(evento.key === "Enter"){
      evento.preventDefault();
      adicionarConvidado();
    }
  });
  campoConvidado.addEventListener("input", function(){
    if(!erroConvidado.hidden){ erroConvidado.hidden = true; }
  });

  desenharLista();
})();
</script>
