<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sua Marca | Pet shop e clínica veterinária</title>
<meta name="description" content="Pet shop e clínica veterinária com consulta, vacina, cirurgia, banho e tosa e planos de assinatura. Agendamento por formulário, sem precisar de ligação.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --tinta:#10361C;
  --tinta-suave:rgba(16,54,28,.76);
  --marca:#4CAF50;
  --marca-escura:#2E7D32;
  --marca-texto:#1B5E20;
  --apoio:#03A9F4;
  --apoio-texto:#01579B;
  --amarelo:#FFEB3B;
  --tinta-verde:#E8F5E9;
  --tinta-azul:#E1F5FE;
  --erro:#C62828;
  --linha:rgba(16,54,28,.16);
  --sombra:0 10px 26px rgba(16,54,28,.08);
  --sombra-forte:0 18px 38px rgba(16,54,28,.16);
  --raio:16px;
  --raio-g:24px;
  --entrada:cubic-bezier(.22,1,.36,1);
  --estado:cubic-bezier(.4,0,.2,1);
  --max:1120px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--tinta);
  font-family:'Nunito',system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:17px;line-height:1.62;overflow-x:hidden;
}
h1,h2,h3,h4{font-family:'Baloo 2','Nunito',sans-serif;line-height:1.14;color:var(--tinta);margin:0 0 .5em;font-weight:700}
h1{font-size:clamp(2rem,7.6vw,3.3rem);letter-spacing:-.01em}
h2{font-size:clamp(1.5rem,4.6vw,2.2rem)}
h3{font-size:1.12rem}
p{margin:0 0 1em}
ul,ol{margin:0;padding:0;list-style:none}
a{color:var(--marca-texto);text-decoration:none}
img,svg{max-width:100%}
.conta{width:100%;max-width:var(--max);margin:0 auto;padding:0 20px}
section{padding:clamp(54px,7.6vw,92px) 0;scroll-margin-top:88px}
:focus-visible{outline:3px solid var(--apoio-texto);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.pular{position:absolute;left:12px;top:-60px;z-index:200;background:var(--marca-texto);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;transition:top .2s var(--estado)}
.pular:focus{top:12px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:48px;padding:12px 22px;border-radius:999px;border:2px solid transparent;
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.05rem;cursor:pointer;
  transition:background-color .2s var(--estado),color .2s var(--estado),border-color .2s var(--estado),transform .2s var(--estado),box-shadow .2s var(--estado);
}
.btn svg{width:22px;height:22px;flex:0 0 auto}
.btn-primario{background:var(--marca-escura);color:#fff}
.btn-primario:hover{background:var(--marca-texto);transform:translateY(-2px);box-shadow:0 12px 24px rgba(27,94,32,.26)}
.btn-secundario{background:#fff;color:var(--marca-texto);border-color:rgba(16,54,28,.24)}
.btn-secundario:hover{border-color:var(--marca);background:var(--tinta-verde);transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn-bloco{width:100%}

.olho{
  display:inline-flex;align-items:center;gap:8px;margin:0 0 12px;
  font-size:.875rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--marca-escura);
}
.olho svg{width:18px;height:18px;color:var(--marca)}
.titulo-secao{max-width:620px;margin-bottom:clamp(28px,4vw,46px)}
.titulo-secao .sub{color:var(--tinta-suave);margin:0}

.cabecalho{position:fixed;top:0;left:0;right:0;z-index:80;background:rgba(255,255,255,0);transition:background-color .25s var(--estado),box-shadow .25s var(--estado)}
.cabecalho.rolou,.cabecalho.menu-aberto{background:#fff;box-shadow:0 8px 26px rgba(16,54,28,.1)}
.cabecalho-conta{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:70px}
.marca-site{display:inline-flex;align-items:center;gap:10px;color:var(--tinta)}
.marca-icone{width:44px;height:44px;border-radius:14px;background:var(--tinta-verde);display:grid;place-items:center;color:var(--marca);flex:0 0 auto}
.marca-icone svg{width:26px;height:26px}
.marca-nome{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.22rem;line-height:1;display:block}
.marca-sub{font-size:.875rem;color:var(--tinta-suave);display:block;margin-top:2px}
.menu-principal ul{display:flex;align-items:center;gap:2px}
.menu-principal a{
  display:block;padding:10px 13px;border-radius:999px;font-weight:700;color:var(--tinta-suave);
  transition:background-color .2s var(--estado),color .2s var(--estado);
}
.menu-principal a:hover{background:var(--tinta-verde);color:var(--tinta)}
.menu-principal .menu-cta{margin-left:8px}
.menu-principal .menu-cta a{background:var(--marca-escura);color:#fff;padding:11px 20px;min-height:44px;display:inline-flex;align-items:center}
.menu-principal .menu-cta a:hover{background:var(--marca-texto);color:#fff}
.menu-botao{
  display:none;width:48px;height:48px;border-radius:14px;border:2px solid var(--linha);background:#fff;
  cursor:pointer;position:relative;padding:0;
  transition:border-color .2s var(--estado),background-color .2s var(--estado);
}
.menu-botao:hover{border-color:var(--marca);background:var(--tinta-verde)}
.menu-botao span{
  position:absolute;left:12px;width:22px;height:3px;border-radius:3px;background:var(--tinta);
  transition:transform .28s var(--estado),opacity .2s var(--estado),top .28s var(--estado);
}
.menu-botao span:nth-child(1){top:15px}
.menu-botao span:nth-child(2){top:22px}
.menu-botao span:nth-child(3){top:29px}
.menu-aberto .menu-botao span:nth-child(1){top:22px;transform:rotate(45deg)}
.menu-aberto .menu-botao span:nth-child(2){opacity:0}
.menu-aberto .menu-botao span:nth-child(3){top:22px;transform:rotate(-45deg)}
<!--FIM-->
</style>
</head>
<body>
